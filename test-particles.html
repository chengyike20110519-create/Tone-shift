<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子测试 - 声痕原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0d16;
  overflow: hidden;
  font-family: "PingFang SC", system-ui, sans-serif;
  color: #eef1f7;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#info {
  position: fixed; left: 16px; top: 16px; z-index: 2;
  background: rgba(10,13,22,0.78); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 14px 18px; font-size: 13px;
  line-height: 1.7; max-width: 320px;
}
#info .label { color: #78d8d2; font-weight: 700; }
#info .ok { color: #5eead4; }
#info .bad { color: #ff8fb1; }
#fps {
  position: fixed; right: 16px; bottom: 16px; z-index: 2;
  background: rgba(10,13,22,0.78); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; padding: 10px 14px; font-family: monospace; font-size: 12px;
  color: rgba(255,255,255,0.7);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <div class="label">粒子最小测试</div>
  <div>· 应该看到 ~150 个彩色光点飘动</div>
  <div>· 右下角 FPS 应该 ≥ 50</div>
  <div class="ok">✅ 看到动 = 原型肯定能跑</div>
  <div class="bad">❌ 黑屏 = 浏览器问题</div>
</div>
<div id="fps">粒子 0 · FPS 0</div>
<script>
(function(){
"useuse strict";
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  c.width = Math.round(W * DPR);
  c.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

var PALETTE = [
  [94, 234, 212], [167, 139, 250], [255, 217, 119],
  [91, 140, 255], [255, 143, 177], [255, 179, 107]
];
var particles = [];

function spawn() {
  if (Math.random() < 0.85) {
    var c = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      px: 0, py: 0,
      vx: (Math.random() - 0.5) * 28,
      vy: (Math.random() - 0.5) * 22,
      life: 0, max: 2.4 + Math.random() * 1.6,
      size: 2 + Math.random() * 3.5,
      r: c[0], g: c[1], b: c[2]
    });
  }
}

var last = performance.now();
var counter = 0;
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  var t = now / 1000;

  spawn();
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.px = p.x; p.py = p.y;
    p.life += dt;
    if (p.life >= p.max || p.y < -40 || p.x < -40 || p.x > W + 40 || p.y > H + 40) {
      particles.splice(i, 1);
      continue;
    }
    p.vx += Math.sin(t * 1.2 + p.y * 0.012) * 26 * 0.24 * dt;
    p.vy += 6 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  while (particles.length > 900) particles.shift();

  // Draw
  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#08091a');
  g.addColorStop(1, '#121b34');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (var j = 0; j < particles.length; j++) {
    var p = particles[j];
    var lifeT = p.life / p.max;
    var alpha = (1 - lifeT) * 0.9;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
    ctx.lineWidth = Math.max(0.5, p.size * 2 * (1 - lifeT * 0.5));
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.fillStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1.5, p.size * (1 - lifeT) * 1.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // Update counter
  counter++;
  if (counter % 15 === 0) {
    document.getElementById('fps').textContent = '粒子 ' + particles.length + ' · FPS ' + Math.round(1 / Math.max(dt, 0.001));
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
