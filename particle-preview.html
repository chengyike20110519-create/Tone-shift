<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>粒子预览</title>
<style>
html,body{margin:0;height:100%;background:#08091a;overflow:hidden;font-family:system-ui,sans-serif;color:#eef1f7}
canvas{display:block}
.hint{position:fixed;top:14px;left:14px;font-size:12px;color:rgba(255,255,255,0.4);font-family:monospace;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">打开后应立即看到五彩粒子飘动</div>
<script>
(function(){
"use strict";
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const hint=document.getElementById("hint");
let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.round(W*DPR);
  c.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
resize();

const palette=["#5eead4","#a78bfa","#ffd977","#5b8cff","#ff8fb1","#ff6b6b","#ffb36b"];
const particles=[];
let frame=0;

function spawnAmbient(){
  if(Math.random()<1){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*30,
      life:0,max:3.2+Math.random()*2.2,
      size:3.5+Math.random()*5,
      color:palette[Math.floor(Math.random()*palette.length)],
      alpha:0.95
    });
  }
  if(Math.random()<0.3){
    particles.push({
      x:Math.random()*W,y:H+20,
      vx:(Math.random()-0.5)*20,vy:-(30+Math.random()*80),
      life:0,max:3+Math.random()*2,size:8+Math.random()*14,
      color:"#5b8cff",alpha:0.4
    });
  }
  if(Math.random()<0.2){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*140,vy:(Math.random()-0.5)*80,
      life:0,max:1.2+Math.random(),size:1.5+Math.random()*3,
      color:"#5eead4",alpha:0.6
    });
  }
  while(particles.length>500) particles.shift();
}

function update(dt){
  spawnAmbient();
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life+=dt;
    if(p.life>=p.max){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=6*dt;
    if(p.y<-40||p.x<-40||p.x>W+40||p.y>H+40){particles.splice(i,1);continue;}
  }
}

function draw(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"#08091a");
  g.addColorStop(1,"#121b34");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    const lifeT=p.life/p.max;
    ctx.globalAlpha=(1-lifeT)*p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,Math.max(1.2,p.size*1.4*(1-lifeT*0.7)+0.6),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
}

let last=performance.now();
let debugCounter=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  frame++;
  update(dt);
  draw();
  debugCounter++;
  if(debugCounter%10===0) hint.textContent="粒子 "+particles.length+" · 帧 "+frame;
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
