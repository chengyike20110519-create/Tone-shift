<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>粒子风暴 - 声痕诊断</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang SC", system-ui, sans-serif; color: #fff; }
canvas { display: block; position: fixed; inset: 0; }
#bar { position: fixed; left: 12px; top: 12px; z-index: 10; padding: 10px 14px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; font-size: 13px; line-height: 1.7; max-width: 340px; }
#bar b { color: #5eead4; }
#bar code { background: #111; padding: 1px 6px; border-radius: 4px; color: #ffd977; font-family: monospace; }
#hud { position: fixed; right: 12px; bottom: 12px; z-index: 10; padding: 8px 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; font-family: monospace; font-size: 12px; color: #5eead4; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <div style="font-size:14px;font-weight:700;margin-bottom:6px">粒子风暴 · 诊断页</div>
  <div>· 如果你看到 <b>彩色光点飘动</b> = 浏览器 OK，原型能跑</div>
  <div>· 如果你看到 <b>纯黑屏</b> = 浏览器/系统问题，需要换浏览器</div>
  <div>· 右下角角标: <code>粒子 N · FPS M</code></div>
  <div style="margin-top:6px;color:#888;font-size:12px">关闭此页返回 index.html</div>
</div>
<div id="hud">粒子 0 · FPS 0</div>
<script>
(function(){
"use strict";
var c = document.getElementById('c');
var ctx = c.getContext('2d');
var W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  c.width = Math.round(W * DPR);
  c.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

var PAL = [
  [94, 234, 212], [167, 139, 250], [255, 217, 119],
  [255, 143, 177], [120, 216, 210], [255, 179, 107]
];

var particles = [];

function spawn(){
  for (var i = 0; i < 2; i++) particles.push(make());
  if (Math.random() < 0.6){
    for (var j = 0; j < 4; j++) particles.push(make());
  }
}

function make(){
  var color = PAL[Math.floor(Math.random() * PAL.length)];
  var angle = Math.random() * Math.PI * 2;
  var speed = 20 + Math.random() * 80;
  return {
    x: Math.random() * W, y: Math.random() * H,
    px: 0, py: 0,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed * 0.6,
    life: 0, max: 2.0 + Math.random() * 2.5,
    size: 8 + Math.random() * 14,
    r: color[0], g: color[1], b: color[2]
  };
}

for (var i = 0; i < 120; i++){
  var p = make();
  p.life = Math.random() * p.max;
  particles.push(p);
}

var last = performance.now();
var counter = 0;
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  var t = now / 1000;

  spawn();
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.px = p.x; p.py = p.y;
    p.life += dt;
    if (p.life >= p.max){ particles.splice(i, 1); continue; }
    p.vx += Math.sin(t * 1.4 + p.y * 0.01) * 18 * dt;
    p.vy += (Math.cos(t * 0.9 + p.x * 0.012) * 14 + 6) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40){
      particles.splice(i, 1);
    }
  }
  while (particles.length > 800) particles.shift();

  ctx.fillStyle = '#07091a';
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (var j = 0; j < particles.length; j++){
    var p = particles[j];
    var lifeT = p.life / p.max;
    var alpha = (1 - lifeT) * 0.95;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
    ctx.lineWidth = Math.max(1, p.size * 0.45 * (1 - lifeT * 0.5));
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.fillStyle = 'rgb(' + Math.min(255, p.r + 60) + ',' + Math.min(255, p.g + 60) + ',' + Math.min(255, p.b + 60) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(2.5, p.size * 0.5 * (1 - lifeT * 0.5)), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  counter++;
  if (counter % 12 === 0){
    document.getElementById('hud').textContent = '粒子 ' + particles.length + ' · FPS ' + Math.round(1 / Math.max(dt, 0.001));
  }
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
